name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # CLAUDE.md and .github/copilot-instructions.md must match AGENTS.md (they are generated from it).
      - run: sh scripts/sync-agent-instructions.sh --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      # Compiles, runs every test (Testcontainers starts MongoDB in the runner's Docker) and the ArchUnit rules.
      - run: ./gradlew build
